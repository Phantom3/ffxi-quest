    <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 backdrop-blur shadow-xl space-y-4">
      <div class="flex flex-col md:flex-row gap-3">
        <div class="relative flex-1">

          <span class="absolute left-3 top-3 text-slate-500">🔍</span>
        </div>
        <div class="flex gap-2">
          <select id="typeFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-amber-500/50">
            <option value="">All Quest Types</option>
          </select>
          <select id="tagFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-amber-500/50">
            <option value="">All Reward Tags</option>
          </select>
          <select id="zoneFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-amber-500/50">
            <option value="">All Zones</option>
          </select>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-3 text-xs text-slate-400 pt-2 border-t border-slate-800/60">
        <div class="flex items-center gap-2">
          <button id="filterAll" class="px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 font-medium">All Quests</button>
          <button id="filterSaved" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Bookmarked</button>
          <button id="filterCompleted" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Completed</button>
          <button id="filterIncomplete" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">To Do</button>

        <div class="flex items-center gap-2">
          <span id="filteredCount" class="font-medium text-slate-300">Showing 477 quests</span>

            📥 Export CSV
          </button>
        </div>
      </div>
    </div>

    <!-- Quest Grid -->
    <div id="questGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Injected by JS -->
    </div>

": "Monk AF3", "r": "Temple Hose"}, {"q": "True Will", "t": "Artifact", "tag": "AF", "npc": "Ryoma", "z": "Norg", "fame": "", "desc": "Ninja AF3", "r": "Ninja Chainmail"}, {"q": "Reap What You Sow", "t": "General", "tag": "GIL", "npc": "Mashuu-Ajuu", "z": "Windurst Waters", "fame": "Any", "desc": "", "r": "700 gil, Stationery Set\nReward of the Stationary Set, and 500 gil for a Sobbing Fungus, 700 gil for a Deathball."}, {"q": "Say It With Flowers", "t": "General", "tag": "GEAR", "npc": "Moari-Kaaori", "z": "Windurst Waters", "fame": "2", "desc": "", "r": "400 gil, Iron Sword\nIron Sword is the reward the first time it is completed properly; 400 gil for repeat; 100 gil if not completed properly."}, {"q": "Scooped!", "t": "General", "tag": "GIL", "npc": "Naiko-Paneiko", "z": "Windurst Waters", "fame": "Unknown", "desc": "Tarutaru Times Quest #2", "r": "1500 gil"}, {"q": "Teacher's Pet", "t": "General", "tag": "GIL", "npc": "Moreno-Toeno", "z": "Windurst Waters", "fame": "Any", "desc": "", "r": "250 gil"}, {"q": "Two Horn the Savage", "t": "General", "tag": "", "npc": "Milazahn", "z": "Aht Urhgan Whitegate", "fame": "", "desc": "", "r": "Imperial Mythril Piece"}, {"q": "Unbridled Passion", "t": "Artifact", "tag": "AF", "npc": "Perih Vashai", "z": "Windurst Woods", "fame": "", "desc": "Ranger AF3", "r": "Hunter's Socks, Ice Arrow"}, {"q": "Under Oath", "t": "Artifact", "tag": "AF", "npc": "", "z": "Chateau d'Oraguille", "fame": "", "desc": "Paladin AF3", "r": "Gallant Surcoat"}, {"q": "Toraimarai Turmoil", "t": "General", "tag": "GIL", "npc": "Ohbiru-Dohbiru", "z": "Windurst Waters", "fame": "Unknown", "desc": "Rhinostery Quest #5", "r": "4500 gil\nThe Certificate and title are obtained when starting the quest, the gil from completing it."}, {"q": "Tuning In", "t": "General", "tag": "GIL", "npc": "Leepe-Hoppe", "z": "Windurst Waters", "fame": "Unknown", "desc": "Tuning Quest #1", "r": "4000 gil"}, {"q": "Tuning Out", "t": "General", "tag": "GEAR", "npc": "Leepe-Hoppe", "z": "Windurst Waters", "fame": "Unknown", "desc": "Tuning Quest #2", "r": "6000 gil, Cache-nez"}, {"q": "Water Way To Go!", "t": "General", "tag": "GIL", "npc": "Ohbiru-Dohbiru", "z": "Windurst Waters", "fame": "Unknown", "desc": "Rhinostery Quest #3", "r": "900 gil"}, {"q": "Unforgiven", "t": "Map", "tag": "UNLOCK", "npc": "Elysia", "z": "Tavnazian Safehold", "fame": "", "desc": "", "r": "Map of Tavnazia"}, {"q": "Wondering Minstrel", "t": "General", "tag": "GEAR", "npc": "Jatan-Paratan", "z": "Windurst Waters", "fame": "6", "desc": "", "r": "Faerie Piccolo"}, {"q": "Unlisted Qualities", "t": "General", "tag": "", "npc": "Luto Mewrilah", "z": "Jeuno Upper", "fame": "Any", "desc": "NPC Fellow Quest #1", "r": "Silver Ingot"}, {"q": "Vanishing Act", "t": "General", "tag": "", "npc": "Ulamaal", "z": "Aht Urhgan Whitegate", "fame": "", "desc": "Epicureans Quest #2", "r": "Imperial Silver Piece\nReward of random Cooking recipes, taught by Ulamaal and Qutiba."}, {"q": "A Greeting Cardian", "t": "General", "tag": "GEAR", "npc": "Kororo", "z": "Windurst Woods", "fame": "4", "desc": "Manustery Quest #2", "r": "Tourmaline Earring"}, {"q": "Can Cardians Cry?", "t": "General", "tag": "GIL", "npc": "Apururu", "z": "Windurst Woods", "fame": "Unknown", "desc": "Manustery Quest #5", "r": "5000 gil"}, {"q": "Chocobilious", "t": "General", "tag": "GIL", "npc": "Kuoh Rhel", "z": "Windurst Woods", "fame": "2", "desc": "Kuoh Rhel Quest #1", "r": "1500 gil"}, {"q": "Creepy Crawlies", "t": "General", "tag": "GIL", "npc": "Illu Bohjaa", "z": "Windurst Woods", "fame": "Any", "desc": "", "r": "600 gil"}, {"q": "In a Stew", "t": "General", "tag": "GIL", "npc": "Kuoh Rhel", "z": "Windurst Woods", "fame": "4", "desc": "Kuoh Rhel Quest #2", "r": "900 gil"}, {"q": "Legendary Plan B", "t": "General", "tag": "GEAR", "npc": "Kopuro-Popuro", "z": "Windurst Woods", "fame": "Unknown", "desc": "Manustery Quest #3", "r": "700 gil, Scentless Armlets"}, {"q": "Mihgo's Amigo", "t": "General", "tag": "GIL", "npc": "Nanaa Mihgo", "z": "Windurst Woods", "fame": "Tenshodo Any", "desc": "Cat Burglar Quest #1", "r": "200 gil"}, {"q": "Paying Lip Service", "t": "General", "tag": "GIL", "npc": "Tapoh Lihzeh", "z": "Windurst Woods", "fame": "Any", "desc": "", "r": "150 gil\nReward of 150 gil for 3 Beehive Chips; 200 gil for 2 Remi Shells."}, {"q": "What Friends Are For", "t": "Map", "tag": "UNLOCK", "npc": "Tsetseroon", "z": "Nashmau", "fame": "", "desc": "", "r": "Imperial Bronze Piece, Map of Aydeewa Subterrane"}, {"q": "Whence Blows the Wind", "t": "Level Break", "tag": "UNLOCK", "npc": "Maat", "z": "Ru'Lude Gardens", "fame": "Any", "desc": "Level Cap (Level 60) Quest #3", "r": "Raises the level cap of the character to 65."}, {"q": "Rock Racketeer", "t": "General", "tag": "GIL", "npc": "Nanaa Mihgo", "z": "Windurst Woods", "fame": "3", "desc": "Cat Burglar Quest #2", "r": "2100 gil"}, {"q": "Wings of Gold", "t": "Artifact", "tag": "AF", "npc": "Brutus", "z": "Jeuno Upper", "fame": "", "desc": "Beastmaster AF1", "r": "Barbaroi Axe"}, {"q": "Wish Upon a Star", "t": "General", "tag": "", "npc": "Zacc", "z": "Bastok Markets", "fame": "5", "desc": "", "r": "Cactus Stems\nFour bags of Cactus Stems are rewarded."}, {"q": "The All-New C-2000", "t": "General", "tag": "GIL", "npc": "Kopuro-Popuro", "z": "Windurst Woods", "fame": "Any", "desc": "Manustery Quest #1", "r": "200 gil"}, {"q": "The All-New C-3000", "t": "General", "tag": "GIL", "npc": "Kopuro-Popuro", "z": "Windurst Woods", "fame": "Unknown", "desc": "Manustery Quest #4", "r": "600 gil"}, {"q": "The Amazin' Scorpio", "t": "General", "tag": "GIL", "npc": "Soni-Muni", "z": "Windurst Woods", "fame": "2", "desc": "", "r": "1500 gil"}, {"q": "Twinstone Bonding", "t": "General", "tag": "GEAR", "npc": "Gioh Ajihri", "z": "Windurst Woods", "fame": "3", "desc": "", "r": "900 gil, Wrapped Bow\nReward of a Wrapped Bow the first time the quest is completed; 900 gil for each completion thereafter."}, {"q": "Yomi Okuri", "t": "Artifact", "tag": "AF", "npc": "Gilgamesh", "z": "Norg", "fame": "", "desc": "Samurai AF2", "r": "Myochin Sune-Ate"}, {"q": "Wrath of the Opo-opos", "t": "General", "tag": "GEAR", "npc": "", "z": "Yuhtunga Jungle", "fame": "", "desc": "", "r": "Opo-opo Necklace"}, {"q": "Your Crystal Ball", "t": "General", "tag": "", "npc": "Kurou-Morou", "z": "Jeuno Lower", "fame": "2", "desc": "Kurou-Morou Quest #1", "r": "Grants the ability to have your fortune told by Kurou-Morou."}];
    let quests = RAW_DATA;
    let completedSet = new Set(JSON.parse(localStorage.getItem('ffxi_completed') || '[]'));
    let bookmarkSet = new Set(JSON.parse(localStorage.getItem('ffxi_bookmarks') || '[]'));
    let activeStatusFilter = 'all';

    function initFilters() {
      const typeSelect = document.getElementById('typeFilter');
      const tagSelect = document.getElementById('tagFilter');
      const zoneSelect = document.getElementById('zoneFilter');

      const types = [...new Set(quests.map(q => q.t).filter(Boolean))].sort();
      const tags = [...new Set(quests.map(q => q.tag).filter(Boolean))].sort();
      const zones = [...new Set(quests.map(q => q.z).filter(Boolean))].sort();

      types.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t;
        typeSelect.appendChild(opt);
      });
      tags.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t;
        tagSelect.appendChild(opt);
      });
      zones.forEach(z => {
        const opt = document.createElement('option');
        opt.value = z; opt.textContent = z;
        zoneSelect.appendChild(opt);
      });
    }

    function saveState() {
      localStorage.setItem('ffxi_completed', JSON.stringify([...completedSet]));
      localStorage.setItem('ffxi_bookmarks', JSON.stringify([...bookmarkSet]));
      updateStats();
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = quests.length;
      document.getElementById('stat-completed').textContent = completedSet.size;
      document.getElementById('stat-bookmarks').textContent = bookmarkSet.size;
    }

    function renderQuests() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const type = document.getElementById('typeFilter').value;
      const tag = document.getElementById('tagFilter').value;
      const zone = document.getElementById('zoneFilter').value;

      const filtered = quests.filter(q => {
        const matchSearch = !search || 
          q.q.toLowerCase().includes(search) || 
          q.npc.toLowerCase().includes(search) || 
          q.z.toLowerCase().includes(search) || 
          q.r.toLowerCase().includes(search) || 
          q.desc.toLowerCase().includes(search);
        
        const matchType = !type || q.t === type;
        const matchTag = !tag || q.tag === tag;
        const matchZone = !zone || q.z === zone;

        let matchStatus = true;
        if (activeStatusFilter === 'saved') matchStatus = bookmarkSet.has(q.q);
        if (activeStatusFilter === 'completed') matchStatus = completedSet.has(q.q);
        if (activeStatusFilter === 'incomplete') matchStatus = !completedSet.has(q.q);

        return matchSearch && matchType && matchTag && matchZone && matchStatus;
      });

      document.getElementById('filteredCount').textContent = `Showing ${filtered.length} of ${quests.length} quests`;
      const grid = document.getElementById('questGrid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500">No quests match your current filters.</div>`;
        return;
      }

      filtered.forEach(q => {
        const isDone = completedSet.has(q.q);
        const isSaved = bookmarkSet.has(q.q);
        const card = document.createElement('div');
        card.className = `bg-slate-900/70 border rounded-2xl p-4 flex flex-col justify-between transition-all hover:border-amber-500/40 hover:bg-slate-900 ${isDone ? 'border-emerald-500/30 opacity-70 bg-emerald-950/10' : 'border-slate-800'}`;
        
        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700/60">${q.t}</span>
                ${q.tag ? `<span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/30 ml-1.5">${q.tag}</span>` : ''}
                <h3 class="text-base font-bold text-white mt-1.5 font-fantasy">${q.q}</h3>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="toggleBookmark('${q.q.replace(/'/g, "\\'")}')" title="Bookmark" class="p-1 text-sm rounded hover:bg-slate-800 ${isSaved ? 'text-cyan-400' : 'text-slate-500'}">★</button>
                <button onclick="toggleComplete('${q.q.replace(/'/g, "\\'")}')" title="Mark complete" class="p-1 text-sm rounded hover:bg-slate-800 ${isDone ? 'text-emerald-400 font-bold' : 'text-slate-500'}">✓</button>
              </div>
            </div>

            <div class="text-xs text-slate-400 space-y-1">
              <div><span class="text-slate-500">NPC:</span> ${q.npc || 'Unknown'}</div>
              <div><span class="text-slate-500">Zone:</span> <span class="text-slate-300">${q.z}</span></div>
              ${q.fame ? `<div><span class="text-slate-500">Fame:</span> ${q.fame}</div>` : ''}
            </div>

            ${q.r ? `
              <div class="bg-slate-950/70 rounded-xl p-2.5 border border-slate-800/80">
                <div class="text-[11px] font-semibold text-amber-400/90 flex items-center gap-1">🎁 Reward</div>
                <div class="text-xs text-slate-200 mt-0.5 font-medium whitespace-pre-line">${q.r}</div>
              </div>` : ''}

            ${q.desc ? `<div class="text-xs text-slate-400 italic">${q.desc}</div>` : ''}
          </div>

          <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-xs">
            <a href="https://www.bg-wiki.com/ffxi/${encodeURIComponent(q.q)}" target="_blank" rel="noopener" class="text-amber-400/80 hover:text-amber-300 underline underline-offset-2">BG-Wiki ↗</a>
            <button onclick="openModal('${q.q.replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-slate-200">Details</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.toggleBookmark = function(title) {
      if (bookmarkSet.has(title)) bookmarkSet.delete(title);
      else bookmarkSet.add(title);
      saveState();
      renderQuests();
    };

    window.toggleComplete = function(title) {
      if (completedSet.has(title)) completedSet.delete(title);
      else completedSet.add(title);
      saveState();
      renderQuests();
    };

    window.openModal = function(title) {
      const q = quests.find(item => item.q === title);
      if (!q) return;
      const modal = document.getElementById('questModal');
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="space-y-4">
          <div>
            <div class="flex gap-2">
              <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">${q.t}</span>
              ${q.tag ? `<span class="text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">${q.tag}</span>` : ''}
            </div>
            <h2 class="text-2xl font-bold font-fantasy text-amber-100 mt-2">${q.q}</h2>
          </div>
          <div class="grid grid-cols-2 gap-3 text-sm bg-slate-950/60 p-4 rounded-xl border border-slate-800">
            <div><span class="text-slate-500">Start NPC:</span> <div class="font-medium text-slate-200">${q.npc || 'None / Object'}</div></div>
            <div><span class="text-slate-500">Start Zone:</span> <div class="font-medium text-slate-200">${q.z}</div></div>
            <div><span class="text-slate-500">Fame Required:</span> <div class="font-medium text-slate-200">${q.fame || 'None / Not listed'}</div></div>
            <div><span class="text-slate-500">Category Tag:</span> <div class="font-medium text-slate-200">${q.tag || 'Standard'}</div></div>
          </div>
          ${q.desc ? `<div><h4 class="text-xs uppercase text-slate-500 font-bold mb-1">Summary / Notes</h4><p class="text-sm text-slate-300">${q.desc}</p></div>` : ''}
          ${q.r ? `
            <div>
              <h4 class="text-xs uppercase text-amber-400 font-bold mb-1">Rewards</h4>
              <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl text-sm text-amber-200 whitespace-pre-line font-medium">${q.r}</div>
            </div>` : ''}
          <div class="flex gap-3 pt-2">
            <a href="https://www.bg-wiki.com/ffxi/${encodeURIComponent(q.q)}" target="_blank" rel="noopener" class="flex-1 py-2 text-center rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-sm transition">View on BG-Wiki ↗</a>
            <a href="https://ffxiclopedia.fandom.com/wiki/${encodeURIComponent(q.q.replace(/ /g, '_'))}" target="_blank" rel="noopener" class="flex-1 py-2 text-center rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm transition">View on FFXIclopedia ↗</a>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
    };

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('questModal').classList.add('hidden');
    });

    // Export CSV
    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      const headers = ['Quest', 'Type', 'Tag', 'Start NPC', 'Start Zone', 'Fame Required', 'Summary', 'Reward', 'Completed', 'Bookmarked'];
      const rows = quests.map(q => [
        `"${(q.q || '').replace(/"/g, '""')}"`,
        `"${(q.t || '').replace(/"/g, '""')}"`,
        `"${(q.tag || '').replace(/"/g, '""')}"`,
        `"${(q.npc || '').replace(/"/g, '""')}"`,
        `"${(q.z || '').replace(/"/g, '""')}"`,
        `"${(q.fame || '').replace(/"/g, '""')}"`,
        `"${(q.desc || '').replace(/"/g, '""')}"`,
        `"${(q.r || '').replace(/"/g, '""')}"`,
        completedSet.has(q.q) ? "Yes" : "No",
        bookmarkSet.has(q.q) ? "Yes" : "No"
      ]);
      const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "ffxi_quest_rewards_export.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Filter Buttons
    const statusBtns = {
      filterAll: 'all',
      filterSaved: 'saved',
      filterCompleted: 'completed',
      filterIncomplete: 'incomplete'
    };
    Object.entries(statusBtns).forEach(([btnId, status]) => {
      document.getElementById(btnId).addEventListener('click', () => {
        activeStatusFilter = status;
        Object.keys(statusBtns).forEach(id => {
          const b = document.getElementById(id);
          if (id === btnId) {
            b.className = 'px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 font-medium';
          } else {
            b.className = 'px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
          }
        });
        renderQuests();
      });
    });

    ['searchInput', 'typeFilter', 'tagFilter', 'zoneFilter'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderQuests);
    });

    // Initialize
    initFilters();
    updateStats();
    renderQuests();
  </script>
</body>
